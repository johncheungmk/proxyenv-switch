name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "VERSION contains $version but the tag is $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  native:
    name: Build native ${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
            filename: ProxyEnvSwitch_x64.exe
          - arch: ARM64
            goarch: arm64
            filename: ProxyEnvSwitch_ARM64.exe

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true
      - name: Build
        shell: bash
        run: |
          mkdir -p release
          GOOS=windows GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -H=windowsgui" \
            -o "release/${{ matrix.filename }}" \
            ./native
      - uses: actions/upload-artifact@v4
        with:
          name: release-native-${{ matrix.arch }}
          path: release/${{ matrix.filename }}
          if-no-files-found: error

  python-exe:
    name: Build Python EXE
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --paths src `
            --name ProxyEnvSwitch `
            --icon assets/proxyenv-switch.ico `
            src/proxyenv_switch.pyw
      - uses: actions/upload-artifact@v4
        with:
          name: release-python-x64
          path: dist/ProxyEnvSwitch.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [validate, native, python-exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums and portable ZIP
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd release-assets
          sha256sum *.exe > SHA256SUMS.txt
          cat > README_RELEASE.txt <<EOF
          ProxyEnv Switch $VERSION

          ProxyEnvSwitch_x64.exe   Windows 11 Intel/AMD 64-bit
          ProxyEnvSwitch_ARM64.exe Windows 11 ARM64
          ProxyEnvSwitch.exe       Python/Tkinter PyInstaller x64 build

          These unsigned executables may trigger Microsoft Defender SmartScreen.
          Verify SHA256SUMS.txt or build from source before running.
          EOF
          zip -9 "ProxyEnv-Switch-Windows-v${VERSION}.zip" \
            ProxyEnvSwitch_x64.exe \
            ProxyEnvSwitch_ARM64.exe \
            ProxyEnvSwitch.exe \
            SHA256SUMS.txt \
            README_RELEASE.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/SHA256SUMS.txt
            release-assets/ProxyEnv-Switch-Windows-*.zip
