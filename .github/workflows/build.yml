name: Build Windows executables

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - agent/**

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Run Python helper tests
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Build x64 and ARM64 executables
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-native-exes.ps1

      - name: Upload Windows executables
        uses: actions/upload-artifact@v4
        with:
          name: ProxyEnvSwitch-Windows
          path: |
            dist/ProxyEnvSwitch_x64.exe
            dist/ProxyEnvSwitch_ARM64.exe
            dist/SHA256SUMS.txt
