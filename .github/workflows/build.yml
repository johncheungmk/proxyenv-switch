name: Build Windows executables

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile and test
        run: |
          python -m py_compile src/proxyenv_core.py src/proxyenv_switch.pyw
          python -m unittest discover -s tests -v

  native:
    name: Native Windows ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            goarch: amd64
            filename: ProxyEnvSwitch_x64.exe
          - arch: ARM64
            goarch: arm64
            filename: ProxyEnvSwitch_ARM64.exe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l native/proxyenv_switch_windows.go)"

      - name: Build executable
        shell: bash
        run: |
          mkdir -p dist
          GOOS=windows GOARCH=${{ matrix.goarch }} \
            go build -trimpath -ldflags="-s -w -H=windowsgui" \
            -o "dist/${{ matrix.filename }}" \
            ./native

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ProxyEnvSwitch-native-${{ matrix.arch }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 14

  python-exe:
    name: Python PyInstaller x64
    needs: python-tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Build executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --paths src `
            --name ProxyEnvSwitch `
            --icon assets/proxyenv-switch.ico `
            src/proxyenv_switch.pyw

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: ProxyEnvSwitch-Python-x64
          path: dist/ProxyEnvSwitch.exe
          if-no-files-found: error
          retention-days: 14
